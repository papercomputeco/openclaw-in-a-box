# jcard.toml — stereOS VM configuration for OpenClaw

mixtape = "opencode-mixtape:latest"

name = "claw-stereo"

[resources]
cpus   = 2
memory = "4GiB"
disk   = "20GiB"

[network]
mode = "nat"
egress_allow = ["api.anthropic.com"]

[[shared]]
host = "./"
guest = "/workspace"
readonly = false

[secrets]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[agent]
harness = "claude-code"
prompt = "cd /workspace && bash scripts/install.sh && bash scripts/start.sh"
workdir = "/workspace"
restart = "no"
