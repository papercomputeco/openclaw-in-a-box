# jcard.toml — stereOS VM configuration for OpenClaw

mixtape = "opencode-mixtape:latest"

name = "openclaw-in-a-box"

[resources]
cpus   = 2
memory = "4GiB"
disk   = "20GiB"

[network]
mode = "nat"
egress_allow = ["api.anthropic.com", "openclaw.ai", "registry.npmjs.org"]

[[shared]]
host = "./"
guest = "/workspace"
readonly = false

[secrets]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
