# jcard.toml — stereOS VM configuration for OpenClaw

mixtape = "opencode-mixtape:latest"

name = "openclaw-in-a-box"

[resources]
cpus   = 2
memory = "4GiB"
disk   = "20GiB"

[network]
mode = "nat"
egress_allow = [
  # core
  "api.anthropic.com",
  "openclaw.ai",
  "registry.npmjs.org",
  # ollama (cloud models)
  "ollama.com",
  # gmail
  "gmail.googleapis.com",
  "oauth2.googleapis.com",
  "accounts.google.com",
  "www.googleapis.com",
  # github
  "api.github.com",
  "github.com",
  # discord
  "discord.com",
  "gateway.discord.gg",
  "cdn.discordapp.com",
]

[timeout]
duration = "2h"

[[shared]]
host = "./"
guest = "/workspace"
readonly = false

[secrets]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
GH_TOKEN = "${GH_TOKEN}"
DISCORD_TOKEN = "${DISCORD_TOKEN}"
# Model provider config (not secrets, but [secrets] is the only
# env-var injection mechanism in stereOS)
MODEL_PROVIDER = "${MODEL_PROVIDER}"
MODEL_NAME = "${MODEL_NAME}"
OLLAMA_API_KEY = "${OLLAMA_API_KEY}"
