[project]
name = "claw-stereo"
version = "0.1.0"
description = "OpenClaw skill template for running agents in stereOS VMs"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]

[tool.coverage.run]
source = ["scripts"]
omit = []

[tool.coverage.report]
show_missing = true
fail_under = 100
