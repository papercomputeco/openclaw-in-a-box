# jcard.toml — stereOS VM configuration for GitHub org triage agent

mixtape = "opencode-mixtape:latest"

name = "github-org-triage"

[resources]
cpus   = 2
memory = "4GiB"
disk   = "20GiB"

[network]
mode = "nat"
egress_allow = [
  "api.anthropic.com",
  "openclaw.ai",
  "registry.npmjs.org",
  "api.github.com",
  "github.com",
]

[timeout]
duration = "1h"

[[shared]]
host = "./"
guest = "/workspace"
readonly = false

[secrets]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
GH_TOKEN = "${GH_TOKEN}"
